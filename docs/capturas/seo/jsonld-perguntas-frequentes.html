<script type="application/ld+json">{"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"Como eu agendo?","acceptedAnswer":{"@type":"Answer","text":"Pelo WhatsApp. No site você escolhe o serviço, o dia e o período, e a mensagem abre pronta. O Pedro confirma o horário com você por lá. Se preferir, escreva direto para (49) 99903-7620. Nada do que você escolhe fica salvo no site."}},{"@type":"Question","name":"Atende sábado?","acceptedAnswer":{"@type":"Answer","text":"Atende. No sábado, das 8h30 às 18h. De segunda a sexta, das 8h30 às 20h. Domingo a barbearia fica fechada. Em feriados o horário pode mudar: o aviso aparece no site e no status ao vivo do topo da página."}},{"@type":"Question","name":"Até que horas atende durante a semana?","acceptedAnswer":{"@type":"Answer","text":"Até as 20h, de segunda a sexta. Dá para marcar depois do trabalho: no montador, escolha o período da noite (das 18h às 20h). No sábado o atendimento vai até as 18h."}},{"@type":"Question","name":"Aceita encaixe?","acceptedAnswer":{"@type":"Answer","text":"Depende da agenda do dia. Mande mensagem no WhatsApp com o serviço e o horário que você consegue, e o Pedro responde se dá para encaixar. Com hora marcada, o horário é seu."}},{"@type":"Question","name":"Preciso agendar ou posso ir direto?","acceptedAnswer":{"@type":"Answer","text":"O atendimento é com hora marcada pelo WhatsApp, um cliente por vez. Assim o seu horário é seu. Se quiser tentar no mesmo dia, mande mensagem antes de sair de casa."}},{"@type":"Question","name":"Quanto tempo leva o degradê?","acceptedAnswer":{"@type":"Answer","text":"Depende do comprimento do cabelo e da altura do degradê, porque cada fase, até o acabamento na shaver, tem seu tempo. Pergunte no WhatsApp ao marcar e o Pedro já reserva o tempo certo."}},{"@type":"Question","name":"Quanto custa?","acceptedAnswer":{"@type":"Answer","text":"A tabela de preços está sendo fechada. Enquanto isso, o valor de cada serviço você confirma com o Pedro no WhatsApp, antes de marcar. Sem surpresa na hora de pagar."}},{"@type":"Question","name":"Quais formas de pagamento aceita?","acceptedAnswer":{"@type":"Answer","text":"Pergunte no WhatsApp ao marcar. As formas aceitas entram aqui assim que forem confirmadas."}},{"@type":"Question","name":"Onde fica a Galeria Augusta? Como eu acho?","acceptedAnswer":{"@type":"Answer","text":"A Galeria Augusta fica na Rua Hercílio Luz, no Centro de Lages. A barbearia é dentro da galeria. Na página Como chegar tem o endereço completo, o mapa e os botões de rota para Google Maps, Waze e Apple Mapas."}},{"@type":"Question","name":"Tem estacionamento?","acceptedAnswer":{"@type":"Answer","text":"A barbearia fica no Centro, na Rua Hercílio Luz. Se você vier de carro, pergunte no WhatsApp onde costuma ter vaga perto da galeria."}},{"@type":"Question","name":"Atende criança?","acceptedAnswer":{"@type":"Answer","text":"Pergunte no WhatsApp ao marcar, dizendo a idade. O Pedro responde se o horário e o serviço combinam."}},{"@type":"Question","name":"Faz sobrancelha e barba?","acceptedAnswer":{"@type":"Answer","text":"Faz. A sobrancelha é limpa na navalha, mantendo o desenho natural. A barba pode ser só o desenho ou a barbaterapia completa, em cinco tempos: toalha quente, esfoliação, creme e massagem, navalha e barba finalizada. Dá para juntar tudo com o corte no mesmo horário."}},{"@type":"Question","name":"Qual pomada eu uso em casa?","acceptedAnswer":{"@type":"Answer","text":"Depende do efeito que você quer: em pó para textura e efeito seco, matte para o dia a dia, com brilho para um cabelo alinhado e extra forte para fixar o dia inteiro. Escova e secador também ajudam. No seu horário o Pedro mostra qual combina com o seu corte."}},{"@type":"Question","name":"Meu cabelo não fica igual em casa. Por quê?","acceptedAnswer":{"@type":"Answer","text":"Quase sempre é a finalização, não o corte. A pomada certa, na quantidade certa, com o cabelo seco e direcionado com escova e secador,
